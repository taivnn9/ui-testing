[project]
name = "ui-defect"
version = "0.1.0"
description = "API phát hiện lỗi UI không cần ảnh tham chiếu (zero-reference)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "lxml>=5.2",
    "httpx>=0.27",
    "imagehash>=4.3",
    "scikit-learn>=1.4",   # A4 color K-means (có fallback numpy nếu thiếu)
]

[project.optional-dependencies]
ocr-paddle = [
    "paddlepaddle>=2.6",
    "paddleocr>=2.7",
]
ocr-tesseract = [
    "pytesseract>=0.3",    # cần thêm: apt install tesseract-ocr tesseract-ocr-vie
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_defect"]

# cài dev: pip install -e ".[dev]"
# cài ocr:  pip install -e ".[ocr]"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ui_defect --cov-report=term-missing -q"

[tool.coverage.run]
source = ["src/ui_defect"]
omit = ["*/tests/*"]

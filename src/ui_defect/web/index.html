<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Defect Analyzer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>UI Defect Analyzer</h1>
    <button id="toggleAdvanced" class="btn btn-secondary">Cài đặt nâng cao</button>
  </header>

  <div class="uploadbar">
    <div id="dropzone" class="dropzone">Kéo-thả ảnh PNG/JPG vào đây hoặc bấm để chọn file</div>
    <input id="fileInput" type="file" accept="image/png,image/jpeg" class="hidden">

    <div id="advanced" class="controls hidden">
      <label>Platform
        <select id="platform">
          <option value="android" selected>android</option>
          <option value="ios">ios</option>
          <option value="web">web</option>
        </select>
      </label>
      <label>Min severity
        <select id="minSeverity">
          <option value="trivial">trivial</option>
          <option value="low" selected>low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="critical">critical</option>
        </select>
      </label>
      <label>Min confidence
        <input id="minConfidence" type="number" min="0" max="1" step="0.05" value="0.4" style="width:70px">
      </label>
      <label><input id="runVlm" type="checkbox" checked> Chạy VLM</label>
    </div>

    <div class="controls">
      <button id="analyzeBtn" class="btn" disabled>Phân tích</button>
    </div>
  </div>

  <div id="banner" class="hidden"></div>

  <div class="layout">
    <div class="col-image">
      <div id="canvasWrap" class="canvas-wrap hidden">
        <img id="screenshot" alt="screenshot">
      </div>
    </div>
    <div class="col-results">
      <div id="summary" class="summary"></div>
      <div id="issueList" class="issue-list">
        <div class="empty">Chưa có kết quả. Tải ảnh và ấn Phân tích.</div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
